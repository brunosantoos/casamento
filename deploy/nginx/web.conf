# Painel e portal (SPA) + proxy para a API na mesma origem (cookies de sessão sem CORS)
# Atrás do Caddy: confia no X-Forwarded-* dele (IP real do visitante e https)
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
  listen 8080;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 110m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location ~ ^/(trpc|api|webhooks|health) {
    proxy_pass http://api:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 120s;
  }

  # Service worker e manifesto sempre revalidados (atualizações do app chegam na hora)
  location = /sw.js { add_header Cache-Control "no-cache" always; add_header Service-Worker-Allowed "/" always; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; default_type application/manifest+json; try_files $uri =404; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
