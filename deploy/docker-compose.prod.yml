# Produção. Segredos via Docker secrets (arquivos fora do repositório) — nada de .env com chaves.
#   echo -n "$(openssl rand -hex 32)" > deploy/secrets/master_key   (idem better_auth_secret, db_password)
# TLS fica no Caddy do host (deploy/Caddyfile): o web só escuta em 127.0.0.1:8090.
name: casamento

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: casa
      POSTGRES_DB: casamento
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U casa"], interval: 5s, retries: 10 }

  migrate:
    build: { context: .., target: server }
    entrypoint: ["/bin/sh", "/app/deploy/with-secrets.sh"]
    command: ["sh", "-c", "cd /app/packages/db && ./node_modules/.bin/prisma migrate deploy"]
    secrets: [db_password, master_key, better_auth_secret]
    environment: &env
      DB_HOST: postgres
      WEB_ORIGIN: https://casamento.brunocristiano.com.br
      API_URL: https://casamento.brunocristiano.com.br
      # Arquivos (contratos, fotos, comprovantes) no volume privado "files", compartilhado por api e worker
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/storage
      # Sem SMTP_HOST os e-mails só vão para o log. Para ativar: SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_FROM aqui
      # e a senha em deploy/secrets/smtp_pass (lida por with-secrets.sh).
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: .., target: server }
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/deploy/with-secrets.sh"]
    command: ["./node_modules/.bin/tsx", "src/index.ts"]
    secrets: [db_password, master_key, better_auth_secret]
    environment: *env
    volumes: [files:/data/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: { context: .., target: server }
    restart: unless-stopped
    working_dir: /app/apps/worker
    entrypoint: ["/bin/sh", "/app/deploy/with-secrets.sh"]
    command: ["./node_modules/.bin/tsx", "src/index.ts"]
    secrets: [db_password, master_key, better_auth_secret]
    environment: *env
    volumes: [files:/data/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: .., target: web }
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8080"]
    depends_on: [api]

secrets:
  db_password: { file: ./secrets/db_password }
  master_key: { file: ./secrets/master_key }
  better_auth_secret: { file: ./secrets/better_auth_secret }

volumes:
  pgdata:
  files:
