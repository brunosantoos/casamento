# CI/CD: todo push na main roda typecheck + testes e, se passar, publica na VPS.
# A chave SSH (secret DEPLOY_SSH_KEY) só consegue executar deploy/deploy.sh no servidor (forced command).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: casa, POSTGRES_PASSWORD: casa, POSTGRES_DB: casamento_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U casa" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://casa:casa@localhost:5432/casamento_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.15.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @casa/api test

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: { name: production, url: "https://casamento.brunocristiano.com.br" }
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - name: Publicar na VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "root@$HOST" "$GITHUB_SHA"
      - name: Conferir saúde
        run: |
          for i in $(seq 1 20); do
            curl -fsS https://casamento.brunocristiano.com.br/health && exit 0
            sleep 3
          done
          exit 1
